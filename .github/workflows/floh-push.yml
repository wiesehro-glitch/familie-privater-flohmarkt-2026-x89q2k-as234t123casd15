
name: Floh Push Check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: floh-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin@13

      - name: Check Firestore and send OneSignal pushes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: node scripts/check-push.mjs

      - name: Save processed article IDs
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- .push-state.json)" ]; then
            echo "Keine Änderungen an .push-state.json."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .push-state.json
          git commit -m "Update push delivery state [skip ci]"

          for attempt in 1 2 3 4 5; do
            echo "Speicherversuch $attempt von 5"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Konflikt beim Zusammenführen der Push-Statusdatei."
              echo "Status wurde nicht überschrieben."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Push-Status erfolgreich gespeichert."
              exit 0
            fi

            echo "Repository wurde zwischenzeitlich geändert."
            sleep 3
          done

          echo "Push-Status konnte nach 5 Versuchen nicht gespeichert werden."
          exit 1
